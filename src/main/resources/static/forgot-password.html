<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - AI 智库管理平台</title>
    <link rel="stylesheet" href="lib/element-plus.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/forgot-password.css">
</head>
<body>
    <div id="app" v-cloak>
        <div class="login-container">
            <div class="login-box">
                <div class="login-header">
                    <div class="logo">🤖</div>
                    <h1>AI 智库管理平台</h1>
                    <p>忘记密码</p>
                </div>

                <!-- 步骤指示器 -->
                <div class="step-indicator">
                    <div class="step-item" :class="{ active: step === 1 }">
                        <div class="step-number">1</div>
                        <span>验证身份</span>
                    </div>
                    <div class="step-line"></div>
                    <div class="step-item" :class="{ active: step === 2 }">
                        <div class="step-number">2</div>
                        <span>重置密码</span>
                    </div>
                </div>

                <!-- 第一步：输入邮箱并发送验证码 -->
                <div v-if="step === 1" class="login-form">
                    <div class="info-box">
                        <strong>温馨提示：</strong><br>
                        • 普通用户请联系租户管理员重置密码<br>
                        • 租户管理员请输入注册时填写的联系邮箱，通过验证码自助重置密码
                    </div>
                    
                    <el-form :model="form" :rules="rules" ref="formRef" label-width="0">
                        <el-form-item prop="email">
                            <el-input
                                v-model="form.email"
                                placeholder="请输入注册邮箱"
                                size="default"
                                clearable
                            >
                                <template #prefix>
                                    <el-icon><message /></el-icon>
                                </template>
                            </el-input>
                        </el-form-item>

                        <el-form-item prop="verifyCode">
                            <el-input
                                v-model="form.verifyCode"
                                placeholder="请输入验证码"
                                size="default"
                                clearable
                            >
                                <template #prefix>
                                    <el-icon><key /></el-icon>
                                </template>
                                <template #append>
                                    <el-button 
                                        @click="handleSendCode" 
                                        :loading="sendingCode"
                                        :disabled="countdown > 0"
                                        class="countdown-btn"
                                    >
                                        {{ countdown > 0 ? `${countdown}s` : '发送验证码' }}
                                    </el-button>
                                </template>
                            </el-input>
                        </el-form-item>

                        <el-button
                            type="primary"
                            :loading="loading"
                            @click="handleNextStep"
                            size="default"
                            class="login-button"
                        >
                            {{ loading ? '验证中...' : '下一步' }}
                        </el-button>
                        
                        <div class="back-link">
                            <el-link type="primary" href="login.html">返回登录</el-link>
                        </div>
                    </el-form>
                </div>

                <!-- 第二步：设置新密码 -->
                <div v-if="step === 2" class="login-form">
                    <div class="info-box warning">
                        <strong>注意：</strong>请妥善保管新密码，建议使用大小写字母、数字和特殊字符组合
                    </div>
                    
                    <el-form :model="form" :rules="resetRules" ref="resetFormRef" label-width="80px">
                        <el-form-item label="用户名" prop="username">
                            <el-input
                                v-model="form.username"
                                placeholder="请输入要重置的管理员用户名"
                                size="default"
                                clearable
                            ></el-input>
                        </el-form-item>

                        <el-form-item label="新密码" prop="newPassword">
                            <el-input
                                v-model="form.newPassword"
                                type="password"
                                placeholder="请输入新密码（至少8位）"
                                size="default"
                                show-password
                            ></el-input>
                        </el-form-item>

                        <el-form-item label="确认密码" prop="confirmPassword">
                            <el-input
                                v-model="form.confirmPassword"
                                type="password"
                                placeholder="请再次输入新密码"
                                size="default"
                                show-password
                            ></el-input>
                        </el-form-item>

                        <el-button
                            type="primary"
                            :loading="resetting"
                            @click="handleResetPassword"
                            size="default"
                            class="login-button"
                        >
                            {{ resetting ? '重置中...' : '确认重置' }}
                        </el-button>
                        
                        <div class="back-link">
                            <el-link type="info" @click="step = 1">返回上一步</el-link>
                        </div>
                    </el-form>
                </div>
            </div>

            <div class="login-footer">
                <p>© 2026 AI 智库管理平台 版权所有</p>
            </div>
        </div>
    </div>

    <!-- 引入 Vue 和 Element Plus -->
    <script src="lib/vue.global.js"></script>
    <script src="lib/element-plus.min.js"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue@2.1.0/dist/index.iife.min.js"></script>
    <script src="lib/zh-cn.min.js"></script>
    
    <!-- 引入 API 封装 -->
    <script src="js/api.js"></script>
    
    <script>
        const { createApp, ref, reactive } = Vue;

        const app = createApp({
            setup() {
                const step = ref(1); // 1-验证身份，2-重置密码
                const loading = ref(false);
                const sendingCode = ref(false);
                const resetting = ref(false);
                const countdown = ref(0);
                let countdownTimer = null;

                const form = reactive({
                    email: '',
                    verifyCode: '',
                    username: '',
                    newPassword: '',
                    confirmPassword: ''
                });

                const formRef = ref(null);
                const resetFormRef = ref(null);

                // 第一步表单验证规则
                const rules = {
                    email: [
                        { required: true, message: '请输入邮箱', trigger: 'blur' },
                        { type: 'email', message: '邮箱格式不正确', trigger: 'blur' }
                    ],
                    verifyCode: [
                        { required: true, message: '请输入验证码', trigger: 'blur' },
                        { len: 6, message: '验证码为6位数字', trigger: 'blur' }
                    ]
                };

                // 第二步表单验证规则
                const resetRules = {
                    username: [
                        { required: true, message: '请输入用户名', trigger: 'blur' }
                    ],
                    newPassword: [
                        { required: true, message: '请输入新密码', trigger: 'blur' },
                        { min: 8, message: '密码长度至少8位', trigger: 'blur' },
                        {
                            validator: (rule, value, callback) => {
                                if (!/[a-zA-Z]/.test(value) || !/[0-9]/.test(value)) {
                                    callback(new Error('密码必须包含字母和数字'));
                                } else {
                                    callback();
                                }
                            },
                            trigger: 'blur'
                        }
                    ],
                    confirmPassword: [
                        { required: true, message: '请确认新密码', trigger: 'blur' },
                        {
                            validator: (rule, value, callback) => {
                                if (value !== form.newPassword) {
                                    callback(new Error('两次输入的密码不一致'));
                                } else {
                                    callback();
                                }
                            },
                            trigger: 'blur'
                        }
                    ]
                };

                // 发送验证码
                const handleSendCode = async () => {
                    if (!form.email) {
                        ElementPlus.ElMessage.warning('请先输入邮箱');
                        return;
                    }

                    // 验证邮箱格式
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(form.email)) {
                        ElementPlus.ElMessage.error('邮箱格式不正确');
                        return;
                    }

                    sendingCode.value = true;
                    try {
                        await window.api.auth.sendResetPasswordCode(form.email);
                        ElementPlus.ElMessage.success('验证码已发送至您的邮箱');
                        
                        // 开始倒计时
                        countdown.value = 60;
                        countdownTimer = setInterval(() => {
                            countdown.value--;
                            if (countdown.value <= 0) {
                                clearInterval(countdownTimer);
                            }
                        }, 1000);
                    } catch (error) {
                        console.error('发送验证码失败:', error);
                        ElementPlus.ElMessage.error(error.message || '发送失败，请稍后重试');
                    } finally {
                        sendingCode.value = false;
                    }
                };

                // 下一步
                const handleNextStep = async () => {
                    if (!formRef.value) return;

                    await formRef.value.validate(async (valid) => {
                        if (!valid) return;

                        loading.value = true;
                        try {
                            // 这里可以添加验证码校验逻辑（可选）
                            // 目前直接跳到第二步，在提交时再校验
                            step.value = 2;
                        } catch (error) {
                            console.error('验证失败:', error);
                            ElementPlus.ElMessage.error(error.message || '验证失败');
                        } finally {
                            loading.value = false;
                        }
                    });
                };

                // 重置密码
                const handleResetPassword = async () => {
                    if (!resetFormRef.value) return;

                    await resetFormRef.value.validate(async (valid) => {
                        if (!valid) return;

                        resetting.value = true;
                        try {
                            await window.api.auth.resetPassword({
                                email: form.email,
                                verifyCode: form.verifyCode,
                                username: form.username,
                                newPassword: form.newPassword
                            });
                            
                            ElementPlus.ElMessage.success('密码重置成功！');
                            
                            setTimeout(() => {
                                window.location.href = '/login';
                            }, 1500);
                        } catch (error) {
                            console.error('重置密码失败:', error);
                            ElementPlus.ElMessage.error(error.message || '重置失败，请稍后重试');
                        } finally {
                            resetting.value = false;
                        }
                    });
                };

                return {
                    step,
                    form,
                    formRef,
                    resetFormRef,
                    rules,
                    resetRules,
                    loading,
                    sendingCode,
                    resetting,
                    countdown,
                    handleSendCode,
                    handleNextStep,
                    handleResetPassword
                };
            }
        });

        // 注册图标组件
        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            app.component(key, component);
        }

        app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
        app.mount('#app');
    </script>
</body>
</html>
