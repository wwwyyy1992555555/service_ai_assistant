<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>租户注册 - AI智库平台</title>
    <!-- 关键：v-cloak 必须内联且优先加载，防止页面闪烁 -->
    <style>
        [v-cloak] { display: none !important; }
    </style>
    <link rel="stylesheet" href="lib/element-plus.css">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <div id="app" v-cloak>
        <div class="register-container">
            <div class="register-card">
                <div class="register-header">
                    <div class="logo" style="font-size: 42px; margin-bottom: 10px; animation: pulse 2s infinite;">🤖</div>
                    <h1>AI 智库管理平台</h1>
                    <p>租户自助注册</p>
                </div>

                <el-form :model="form" :rules="rules" ref="registerForm" label-position="left" label-width="80px">
                <!-- 第一步：邮箱验证 -->
                <div class="form-section" v-if="step === 1">
                    <div class="section-title">邮箱验证</div>
                    <el-form-item label="邮箱" prop="contactEmail">
                        <el-input v-model="form.contactEmail" placeholder="请输入邮箱地址"></el-input>
                    </el-form-item>
                    <div class="form-actions">
                        <el-button type="primary" class="verify-btn" @click="handleSendCode" :loading="sendingCode" :disabled="countdown > 0">
                            {{ countdown > 0 ? countdown + '秒后重试' : '获取验证码' }}
                        </el-button>
                    </div>
                </div>

                <!-- 第二步：填写信息 -->
                <div v-if="step === 2">
                    <!-- 企业信息 -->
                    <div class="form-section">
                        <div class="section-title">企业信息</div>
                        <el-form-item label="企业名称" prop="tenantName">
                            <el-input v-model="form.tenantName" placeholder="请输入企业全称"></el-input>
                        </el-form-item>
                        <el-form-item label="联系人" prop="contactPerson">
                            <el-input v-model="form.contactPerson" placeholder="请输入联系人姓名"></el-input>
                        </el-form-item>
                        <el-form-item label="联系电话" prop="contactPhone">
                            <el-input v-model="form.contactPhone" placeholder="请输入手机号"></el-input>
                        </el-form-item>
                        <el-form-item label="邮箱地址" prop="contactEmail">
                            <el-input v-model="form.contactEmail" disabled></el-input>
                        </el-form-item>
                        <el-form-item label="验证码" prop="verifyCode">
                            <el-input v-model="form.verifyCode" placeholder="请输入邮箱验证码" maxlength="6"></el-input>
                        </el-form-item>
                    </div>

                    <!-- 管理员账号 -->
                    <div class="form-section">
                        <div class="section-title">管理员账号</div>
                        <el-form-item label="用户名" prop="adminUsername">
                            <el-input v-model="form.adminUsername" placeholder="用于登录管理后台"></el-input>
                        </el-form-item>
                        <el-form-item label="密码" prop="adminPassword">
                            <el-input v-model="form.adminPassword" type="password" placeholder="至少8位，包含字母和数字" show-password></el-input>
                        </el-form-item>
                        <el-form-item label="确认密码" prop="confirmPassword">
                            <el-input v-model="form.confirmPassword" type="password" placeholder="请再次输入密码" show-password></el-input>
                        </el-form-item>
                    </div>

                    <div class="form-actions">
                        <el-button type="primary" size="large" class="submit-btn" @click="handleSubmit" :loading="loading">
                            {{ loading ? '注册中...' : '立即注册' }}
                        </el-button>
                    </div>
                </div>

                <div class="form-footer">
                    <el-link type="primary" href="/login">已有账号？立即登录</el-link>
                </div>
                </el-form>
            </div>
        </div>

        <!-- 注册成功对话框 -->
        <el-dialog v-model="successDialogVisible" title="🎉 注册成功" width="500px" :close-on-click-modal="false">
            <div class="success-dialog">
                <p class="success-dialog-title">
                    恭喜您！租户注册成功
                </p>
                <p class="success-dialog-subtitle">
                    您的租户编码（tenant_code）：
                </p>
                <div class="tenant-code-display">
                    {{ tenantCode }}
                </div>
                <div class="tip-text">
                    <strong>📌 重要提示：</strong><br>
                    1. 请使用管理员账号登录后台：<a href="/login" class="success-dialog-link">点击跳转</a><br>
                    2. 租户编码：{{ tenantCode }}<br>
                    3. 在后台可以自定义 Logo、主题色、欢迎语等配置
                </div>
            </div>
            <template #footer>
                <el-button type="primary" @click="goToLogin">前往登录</el-button>
            </template>
        </el-dialog>
    </div>

    <script src="lib/vue.global.js"></script>
    <script src="lib/element-plus.min.js"></script>

    <script>
        const { createApp, ref, reactive } = Vue;

        const app = createApp({
            setup() {
                const loading = ref(false);
                const sendingCode = ref(false);
                const successDialogVisible = ref(false);
                const tenantCode = ref('');
                const step = ref(1); // 1-邮箱验证，2-填写信息
                const countdown = ref(0); // 倒计时
        
                const form = reactive({
                    tenantName: '',
                    contactPerson: '',
                    contactPhone: '',
                    contactEmail: '',
                    verifyCode: '',
                    adminUsername: '',
                    adminPassword: '',
                    confirmPassword: ''
                });
        
                const registerForm = ref(null);
        
                // 密码验证规则
                const validatePassword = (rule, value, callback) => {
                    if (!value) {
                        callback(new Error('请输入密码'));
                    } else if (value.length < 8) {
                        callback(new Error('密码长度至少 8 位'));
                    } else if (!/[a-zA-Z]/.test(value) || !/[0-9]/.test(value)) {
                        callback(new Error('密码必须包含字母和数字'));
                    } else {
                        callback();
                    }
                };
        
                const validateConfirmPassword = (rule, value, callback) => {
                    if (!value) {
                        callback(new Error('请再次输入密码'));
                    } else if (value !== form.adminPassword) {
                        callback(new Error('两次输入的密码不一致'));
                    } else {
                        callback();
                    }
                };
        
                const rules = {
                    contactEmail: [
                        { required: true, message: '请输入邮箱', trigger: 'blur' },
                        { type: 'email', message: '邮箱格式不正确', trigger: 'blur' }
                    ],
                    tenantName: [
                        { required: true, message: '请输入企业名称', trigger: 'blur' }
                    ],
                    contactPerson: [
                        { required: true, message: '请输入联系人姓名', trigger: 'blur' }
                    ],
                    contactPhone: [
                        { required: true, message: '请输入联系电话', trigger: 'blur' },
                        { pattern: /^1[3-9]\d{9}$/, message: '手机号格式不正确', trigger: 'blur' }
                    ],
                    verifyCode: [
                        { required: true, message: '请输入验证码', trigger: 'blur' },
                        { pattern: /^\d{6}$/, message: '验证码为 6 位数字', trigger: 'blur' }
                    ],
                    adminUsername: [
                        { required: true, message: '请输入用户名', trigger: 'blur' },
                        { min: 3, max: 20, message: '用户名长度 3-20 位', trigger: 'blur' }
                    ],
                    adminPassword: [
                        { required: true, validator: validatePassword, trigger: 'blur' }
                    ],
                    confirmPassword: [
                        { required: true, validator: validateConfirmPassword, trigger: 'blur' }
                    ]
                };
        
                // 发送验证码
                const handleSendCode = async () => {
                    if (!registerForm.value) return;
        
                    // 前置校验：邮箱格式
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!form.contactEmail || !emailRegex.test(form.contactEmail)) {
                        ElementPlus.ElMessage.error('请输入正确的邮箱地址');
                        return;
                    }
        
                    try {
                        // 验证邮箱字段
                        await registerForm.value.validateField('contactEmail');
        
                        sendingCode.value = true;
                        console.log('【发送验证码】开始，邮箱:', form.contactEmail);
                        const response = await fetch('/api/tenant/register/send-verify-code', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                contactEmail: form.contactEmail
                            })
                        });
        
                        console.log('【发送验证码】响应状态:', response.status);
                        const result = await response.json();
                        console.log('【发送验证码】响应数据:', result);
        
                        if (result.code === 200) {
                            ElementPlus.ElMessage.success('验证码已发送至您的邮箱');
                            step.value = 2; // 进入第二步
                            console.log('【发送验证码】成功，切换到第二步');
                            startCountdown();
                        } else {
                            ElementPlus.ElMessage.error(result.message || '发送失败');
                            console.error('【发送验证码】业务错误:', result.message);
                        }
                    } catch (error) {
                        console.error('【发送验证码】验证失败或网络异常:', error);
                        ElementPlus.ElMessage.error('请输入正确的邮箱地址');
                    } finally {
                        sendingCode.value = false;
                    }
                };
        
                // 开始倒计时
                const startCountdown = () => {
                    countdown.value = 60;
                    const timer = setInterval(() => {
                        countdown.value--;
                        if (countdown.value <= 0) {
                            clearInterval(timer);
                        }
                    }, 1000);
                };
        
                const handleSubmit = async () => {
                    if (!registerForm.value) return;
        
                    await registerForm.value.validate(async (valid) => {
                        if (!valid) return;
        
                        loading.value = true;
                        try {
                            const response = await fetch('/api/tenant/register/register', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    tenantName: form.tenantName,
                                    contactPerson: form.contactPerson,
                                    contactPhone: form.contactPhone,
                                    contactEmail: form.contactEmail,
                                    verifyCode: form.verifyCode,
                                    adminUsername: form.adminUsername,
                                    adminPassword: form.adminPassword
                                })
                            });
        
                            const result = await response.json();
        
                            if (result.code === 200) {
                                tenantCode.value = result.data.tenantCode;
                                successDialogVisible.value = true;
                                ElementPlus.ElMessage.success('注册成功！请使用管理员账号登录');
                            } else {
                                ElementPlus.ElMessage.error(result.message || '注册失败');
                            }
                        } catch (error) {
                            console.error('注册失败:', error);
                            ElementPlus.ElMessage.error('网络异常，请稍后重试');
                        } finally {
                            loading.value = false;
                        }
                    });
                };
        
                const goToLogin = () => {
                    window.location.href = '/login';
                };
        
                return {
                    form,
                    registerForm,
                    rules,
                    loading,
                    sendingCode,
                    successDialogVisible,
                    tenantCode,
                    step,
                    countdown,
                    handleSendCode,
                    handleSubmit,
                    goToLogin
                };
            }
        });

        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>
</html>
